<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedgerow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;800&family=Vollkorn:wght@400;700;800&display=swap">
<style>
/* Board first, a plain ledger beside it. Vollkorn (it means "wholegrain") for words that matter, Alegreya Sans for the rest. */
:root{
  --ground:#e4e8da; --panel:#f3f4ec; --ink:#1c241d; --muted:#5a6455; --line:#cdd2c1;
  --p0:#b5332a; --p1:#1f5c8f; --on-pc:#fff;
  --forest:#557f48; --field:#dcb54c; --lake:#62a0c6; --mountain:#8b909a;
  --display:"Vollkorn", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#131814; --panel:#1a201b; --ink:#e3e7da; --muted:#98a190; --line:#2f382f;
  --p0:#f08572; --p1:#82b8e8; --on-pc:#131814;
  --forest:#466f3c; --field:#c29c3b; --lake:#4a87b1; --mountain:#727884;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#131814; --panel:#1a201b; --ink:#e3e7da; --muted:#98a190; --line:#2f382f;
  --p0:#f08572; --p1:#82b8e8; --on-pc:#131814;
  --forest:#466f3c; --field:#c29c3b; --lake:#4a87b1; --mountain:#727884;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh;height:100dvh}
.board{position:relative;min-width:0;min-height:0;overflow:hidden}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.panel{--bleed:22px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:24px;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) 22px}

.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:800 2rem/1 var(--display);margin:0;letter-spacing:-.02em}
.turncount{color:var(--muted);font-variant-numeric:tabular-nums}
.sec{font:800 1rem/1 var(--body);margin:0 0 10px}

.players{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm sc" "fl sc";column-gap:12px;row-gap:6px;align-items:center;
  margin-inline:calc(-1 * var(--bleed));padding:12px var(--bleed);border-bottom:1px solid var(--line);transition:background-color .2s}
.pl.active{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.pl .nm{grid-area:nm;display:flex;align-items:baseline;gap:8px;min-width:0;font-weight:800;color:var(--pc)}
.pl .nm>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tp{font-weight:500;font-size:.88rem;color:var(--muted);white-space:nowrap}
.pl .sc{grid-area:sc;font:800 2.2rem/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
.pl .fl{grid-area:fl;display:flex;gap:4px;align-items:center;font-size:.88rem;color:var(--muted)}
.pl .fl svg{width:9px;height:14px;display:block}
.pl .fl .used{opacity:.2}

.turn{display:flex;flex-direction:column;gap:14px}
.status{font:400 1.4rem/1.25 var(--display);margin:0;text-wrap:balance;min-height:2.5em}
.status b{font-weight:700;color:var(--pc)}
.market{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk{background:none;border:0;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.95rem;font-weight:500}
.mk svg{width:62px;height:68px;display:block;transition:transform .15s ease}
.mk span{text-decoration:underline 3px transparent;text-underline-offset:5px}
.mk:hover:not(:disabled) svg{transform:translateY(-2px)}
.mk.sel svg{transform:translateY(-5px)}
.mk.sel span{font-weight:800;color:var(--pc);text-decoration-color:var(--pc)}
.mk:disabled{cursor:default;opacity:.45}
.empty{grid-column:1/-1;color:var(--muted)}
.preview{font-size:.95rem;display:flex;flex-direction:column;gap:2px}
.preview:empty{display:none}
.preview .row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.preview .row>span:first-child,.preview .hint{color:var(--muted)}
.preview strong{font-weight:800}
.btns{display:flex;gap:8px}
.btns:empty{display:none}
.btn{flex:1 1 0;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:3px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.primary{background:var(--pc);border-color:var(--pc);color:var(--on-pc)}
.btn.primary:hover{background:color-mix(in srgb,var(--pc) 88%,var(--ink))}

.tools{margin-top:auto;display:flex;gap:18px;padding-top:12px;border-top:1px solid var(--line)}
.tools button,.link{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);font-weight:500;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:color .15s,text-decoration-color .15s}
.tools button:hover:not(:disabled),.link:hover{color:var(--ink);text-decoration-color:currentColor}
.tools button:disabled{opacity:.4;cursor:default}
.link{color:var(--ink);text-decoration-color:var(--line)}

/* Map drawing */
.hexline{fill:none;stroke:rgba(0,0,0,.18);stroke-width:1.2}
.outline{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.spot{fill:transparent;stroke:var(--pc);stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:3 4;cursor:pointer}
.spot.ok{fill:color-mix(in srgb,var(--pc) 7%,transparent)}
.spot.ok.on{fill:color-mix(in srgb,var(--pc) 16%,transparent)}
.spot.bad{stroke:var(--muted);stroke-opacity:.35;cursor:not-allowed}
.ghost{opacity:.85;pointer-events:none}
.mark{fill:none;stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

/* Dialogs */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--ground) 86%,transparent)}
.card{--bleed:28px;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:26px 28px 24px;width:100%;max-width:430px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.card h2{font:700 1.75rem/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:800;color:var(--pc)}
.field input{font:inherit;padding:8px 10px;border-radius:3px;border:1.5px solid var(--line);background:var(--ground);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--pc)}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.chk b{color:var(--ink);font-weight:800}
.chk input{margin:4px 0 0;width:16px;height:16px;flex:none;accent-color:var(--ink)}
.fig{background:var(--ground);border-radius:3px;height:180px;overflow:hidden}
.fig svg{width:100%;height:100%;display:block}
.rnav{display:flex;align-items:center;gap:8px}
.rnav .step{flex:1;color:var(--muted);font-variant-numeric:tabular-nums}
.rnav .btn{flex:0 0 auto;min-width:90px}
.plist{display:flex;flex-direction:column;gap:3px}
.plist div{display:flex;justify-content:space-between;gap:8px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52vh auto;grid-template-rows:52dvh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(18px, env(safe-area-inset-left, 0px));padding-top:16px;gap:18px}
  h1{font-size:1.6rem}
  .panel .players{flex-direction:row;gap:8px;border-top:0}
  .panel .pl{flex:1 1 0;min-width:0;margin:0;border:1.5px solid var(--line);border-radius:4px;padding:10px 12px}
  .panel .pl.active{border-color:var(--pc)}
  .panel .pl .tp{display:none}
  .pl .sc{font-size:1.8rem}
  .status{min-height:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>
<div class="app" id="root">
  <div class="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Game board"></svg></div>
  <aside class="panel">
    <header class="masthead"><h1>Hedgerow</h1><span class="turncount" id="turncount"></span></header>
    <section class="players" id="scores" aria-label="Scores"></section>
    <section class="turn">
      <p class="status" id="status" aria-live="polite"></p>
      <div>
        <h2 class="sec">Market</h2>
        <div class="market" id="market"></div>
      </div>
      <div class="preview" id="preview"></div>
      <div class="btns" id="actions"></div>
    </section>
    <footer class="tools">
      <button id="undo" type="button">Undo</button>
      <button id="rulesbtn" type="button">How to play</button>
      <button id="newbtn" type="button">New game</button>
    </footer>
  </aside>
</div>

<div class="ov" id="setup" hidden>
  <form class="card" id="setupform" role="dialog" aria-modal="true" aria-labelledby="setuph">
    <h2 id="setuph">New game</h2>
    <p>Two players share this screen and take turns. <button type="button" class="link" id="setuprules">How to play</button></p>
    <div class="field" style="--pc:var(--p0)"><label for="p0name">Plays first</label><input type="text" id="p0name" maxlength="14" autocomplete="off"></div>
    <div class="field" style="--pc:var(--p1)"><label for="p1name">Plays second</label><input type="text" id="p1name" maxlength="14" autocomplete="off"></div>
    <label class="chk"><input type="checkbox" id="friendly"><span><b>Friendly rules.</b> A claimed patch can't be merged with another patch, so claims stay safe.</span></label>
    <div class="btns" style="--pc:var(--ink)">
      <button class="btn" type="button" id="setupcancel">Cancel</button>
      <button class="btn primary" type="submit">Start game</button>
    </div>
  </form>
</div>

<div class="ov" id="rulesov" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rtitle" style="--pc:var(--ink)">
    <div class="fig" id="rfig"></div>
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
    <div class="rnav">
      <span class="step" id="rstep"></span>
      <button class="btn" type="button" data-act="rprev" id="rprev">Back</button>
      <button class="btn primary" type="button" data-act="rnext" id="rnext">Next</button>
    </div>
  </div>
</div>

<div class="ov" id="endov" hidden>
  <div class="card" id="endcard" role="dialog" aria-modal="true" style="--pc:var(--ink)"></div>
</div>

<script>
(function(){
const TYPES={forest:'Forest',field:'Field',lake:'Lake',mountain:'Mountain'};
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const K=(q,r)=>q+','+r;
const SZ=34, R3=Math.sqrt(3);
const $=id=>document.getElementById(id);
const svg=$('svg');
const touch=matchMedia('(hover: none)').matches;

let G=null, hist=[], hover=null, pending=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newGame(names,friendly){
  const bag=[];[['forest',9],['field',9],['lake',8],['mountain',8]].forEach(([t,n])=>{for(let i=0;i<n;i++)bag.push(t);});
  shuffle(bag);
  const tiles={};tiles[K(0,0)]={q:0,r:0,t:bag.pop(),flag:null};
  return {tiles,bag,market:[bag.pop(),bag.pop(),bag.pop()],turn:0,flags:[6,6],placed:0,total:30,phase:'pick',sel:null,last:null,names,friendly};
}
const clone=o=>JSON.parse(JSON.stringify(o));
const pc=p=>p===0?'var(--p0)':'var(--p1)';
const fmt=n=>{const w=Math.floor(n);return n%1?(w?w:'')+'½':String(w);};
const fd=d=>d>0?'+'+fmt(d):d<0?'−'+fmt(-d):'0';
const f1=n=>n.toFixed(1);
const plural=(n,w)=>`${fmt(n)} ${w}${n===1?'':'s'}`;

/* ---------- rules ---------- */
function patches(tiles){
  const seen={},list=[];
  for(const k in tiles){
    if(seen[k])continue;
    const t=tiles[k].t,keys=[],st=[k];seen[k]=1;
    while(st.length){const c=st.pop();keys.push(c);const {q,r}=tiles[c];
      for(const [dq,dr] of DIRS){const n=K(q+dq,r+dr);if(!seen[n]&&tiles[n]&&tiles[n].t===t){seen[n]=1;st.push(n);}}}
    const f=[0,0];keys.forEach(x=>{const fl=tiles[x].flag;if(fl===0||fl===1)f[fl]++;});
    let pts=[0,0];const n=keys.length;
    if(f[0]>f[1])pts=[n,0];else if(f[1]>f[0])pts=[0,n];else if(f[0]>0)pts=[n/2,n/2];
    list.push({t,keys,f,pts,size:n});
  }
  return list;
}
const totals=list=>list.reduce((a,p)=>[a[0]+p.pts[0],a[1]+p.pts[1]],[0,0]);
function patchOf(tiles,key){return patches(tiles).find(p=>p.keys.includes(key));}
function candidates(){
  const out={};
  for(const k in G.tiles){const {q,r}=G.tiles[k];for(const [dq,dr] of DIRS){const n=K(q+dq,r+dr);if(!G.tiles[n])out[n]={q:q+dq,r:r+dr};}}
  return out;
}
function legal(key,q,r,t){
  if(!G.friendly)return true;
  const list=patches(G.tiles),touched=new Set();
  for(const [dq,dr] of DIRS){const n=K(q+dq,r+dr);const tl=G.tiles[n];if(tl&&tl.t===t){touched.add(list.findIndex(p=>p.keys.includes(n)));}}
  if(touched.size<2)return true;
  return ![...touched].some(i=>list[i].f[0]+list[i].f[1]>0);
}
function simulate(key,q,r,t,flag){
  const tiles=Object.assign({},G.tiles);tiles[key]={q,r,t,flag:flag?G.turn:null};
  const before=totals(patches(G.tiles)),after=totals(patches(tiles));
  return [after[0]-before[0],after[1]-before[1]];
}

/* ---------- actions ---------- */
function push(){hist.push(clone(G));if(hist.length>80)hist.shift();}
function pick(i){if(G.phase!=='pick'&&G.phase!=='place')return;G.sel=i;G.phase='place';pending=null;render();}
function place(key){
  const c=candidates()[key];if(!c||G.sel===null)return;
  const t=G.market[G.sel];if(!legal(key,c.q,c.r,t))return;
  push();
  G.tiles[key]={q:c.q,r:c.r,t,flag:null};
  if(G.bag.length)G.market[G.sel]=G.bag.pop();else G.market.splice(G.sel,1);
  G.placed++;G.last=key;G.sel=null;pending=null;hover=null;
  if(G.flags[G.turn]>0)G.phase='flag';else endTurn();
  render();
}
function plant(){if(G.phase!=='flag')return;push();G.tiles[G.last].flag=G.turn;G.flags[G.turn]--;endTurn();render();}
function skip(){if(G.phase!=='flag')return;push();endTurn();render();}
function endTurn(){G.turn=1-G.turn;G.phase=(G.placed>=G.total||!G.market.length)?'over':'pick';}
function undo(){if(!hist.length)return;G=hist.pop();pending=null;hover=null;render();}

/* ---------- drawing ---------- */
function center(q,r){return [SZ*R3*(q+r/2),SZ*1.5*r];}
function hexPts(cx,cy,s){let p='';for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p+=f1(cx+s*Math.cos(a))+','+f1(cy+s*Math.sin(a))+' ';}return p;}
function rnd(q,r,i){const x=Math.sin(q*12.9898+r*78.233+i*37.719)*43758.5453;return x-Math.floor(x);}
function art(t,cx,cy,s,q,r){
  const k=s/34;let o='';
  if(t==='forest'){
    const pos=[[-10,-4],[9,-7],[0,9],[-14,10],[14,8]];
    pos.forEach(([x,y],i)=>{if(i>2&&rnd(q,r,i)<.5)return;const X=cx+x*k,Y=cy+y*k,h=(13+rnd(q,r,i+5)*4)*k,w=7*k;
      o+=`<path d="M${X},${Y-h} L${X+w},${Y} L${X-w},${Y}Z" fill="rgba(20,45,20,.55)"/><rect x="${X-1.2*k}" y="${Y}" width="${2.4*k}" height="${3.5*k}" fill="rgba(60,35,15,.6)"/>`;});
  }else if(t==='field'){
    for(let i=-2;i<=2;i++){const y=cy+i*7*k;o+=`<path d="M${cx-18*k},${y+5*k} L${cx+18*k},${y-5*k}" stroke="rgba(120,80,10,.38)" stroke-width="${2.2*k}" stroke-linecap="round"/>`;}
  }else if(t==='lake'){
    [[-6,-6],[6,3],[-3,12]].forEach(([x,y])=>{const X=cx+x*k,Y=cy+y*k;o+=`<path d="M${X-8*k},${Y} q${4*k},${-4*k} ${8*k},0 t${8*k},0" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="${1.8*k}" stroke-linecap="round"/>`;});
  }else{
    const p1=`M${cx-20*k},${cy+12*k} L${cx-5*k},${cy-12*k} L${cx+8*k},${cy+12*k}Z`,p2=`M${cx-2*k},${cy+12*k} L${cx+10*k},${cy-5*k} L${cx+21*k},${cy+12*k}Z`;
    o+=`<path d="${p1}" fill="rgba(45,48,58,.5)"/><path d="${p2}" fill="rgba(45,48,58,.38)"/><path d="M${cx-5*k},${cy-12*k} L${cx-9*k},${cy-5.5*k} L${cx-1.5*k},${cy-5.5*k}Z" fill="rgba(255,255,255,.85)"/>`;
  }
  return o;
}
function flagSvg(cx,cy,p){
  return `<g pointer-events="none"><ellipse cx="${cx-2}" cy="${cy+12}" rx="4.5" ry="1.7" fill="rgba(0,0,0,.22)"/><line x1="${cx-2}" y1="${cy+12}" x2="${cx-2}" y2="${cy-16}" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M${cx-1.5},${cy-16} L${cx+13},${cy-10.5} L${cx-1.5},${cy-5}Z" fill="${pc(p)}" stroke="var(--panel)" stroke-width="1.2" stroke-linejoin="round"/></g>`;
}
function miniHex(t,cls){return `<svg viewBox="-30 -32 60 64" aria-hidden="true"${cls?` class="${cls}"`:''}><polygon points="${hexPts(0,0,29)}" fill="var(--${t})"/>${art(t,0,0,29,3,7)}<polygon points="${hexPts(0,0,29)}" class="hexline"/></svg>`;}
function flagIcon(p,used){return `<svg viewBox="0 0 11 16" class="${used?'used':''}" aria-hidden="true"><line x1="1.5" y1="1" x2="1.5" y2="15" stroke="var(--ink)" stroke-width="1.6"/><path d="M1.5,1 L10,4.5 L1.5,8Z" fill="${pc(p)}"/></svg>`;}
function edge(q,r,d,s){
  const [cx,cy]=center(q,r),[dx,dy]=center(DIRS[d][0],DIRS[d][1]),th=Math.atan2(dy,dx),a=th-Math.PI/6,b=th+Math.PI/6;
  return `<line x1="${f1(cx+s*Math.cos(a))}" y1="${f1(cy+s*Math.sin(a))}" x2="${f1(cx+s*Math.cos(b))}" y2="${f1(cy+s*Math.sin(b))}"/>`;
}
function drawLand(tiles,interactive){
  let land='',flags='';
  for(const k in tiles){const tl=tiles[k],[cx,cy]=center(tl.q,tl.r);
    land+=`<g${interactive?` data-tile="${k}"`:''}><polygon points="${hexPts(cx,cy,SZ+.5)}" fill="var(--${tl.t})"/>${art(tl.t,cx,cy,SZ,tl.q,tl.r)}<polygon points="${hexPts(cx,cy,SZ)}" class="hexline"/></g>`;
    if(tl.flag===0||tl.flag===1)flags+=flagSvg(cx,cy,tl.flag);
  }
  return {land,flags};
}
function perimeter(tiles,keys,color){
  const set=new Set(keys);let o='';
  keys.forEach(k=>{const tl=tiles[k];DIRS.forEach(([dq,dr],d)=>{if(!set.has(K(tl.q+dq,tl.r+dr)))o+=edge(tl.q,tl.r,d,SZ);});});
  return `<g class="outline"${color?` style="stroke:${color}"`:''} pointer-events="none">${o}</g>`;
}

function renderBoard(){
  const all=candidates(),cand=G.phase==='place'?all:{};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  [...Object.keys(G.tiles),...Object.keys(all)].forEach(k=>{const [q,r]=k.split(',').map(Number);const [x,y]=center(q,r);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
  // A minimum frame keeps the opening tiles from filling the whole screen.
  const narrow=svg.clientWidth<600;
  const w=Math.max(x1-x0+SZ*2.4,SZ*R3*(narrow?6:11)),h=Math.max(y1-y0+SZ*2.6,SZ*1.5*(narrow?6:9)),mx=(x0+x1)/2,my=(y0+y1)/2;
  svg.setAttribute('viewBox',`${f1(mx-w/2)} ${f1(my-h/2)} ${f1(w)} ${f1(h)}`);
  svg.style.setProperty('--pc',pc(G.turn));
  const t=G.sel!==null?G.market[G.sel]:null,gk=pending||hover;
  let o='';
  for(const k in cand){const {q,r}=cand[k];const [cx,cy]=center(q,r);const ok=legal(k,q,r,t);
    o+=`<polygon data-spot="${k}" ${ok?'':'data-bad="1"'} points="${hexPts(cx,cy,SZ-3)}" class="spot ${ok?'ok':'bad'}${k===gk?' on':''}"/>`;}
  const L=drawLand(G.tiles,true);
  o+=L.land;
  if(G.phase==='place'&&gk&&cand[gk]&&legal(gk,cand[gk].q,cand[gk].r,t)){const {q,r}=cand[gk];const [cx,cy]=center(q,r);
    o+=`<g class="ghost"><polygon points="${hexPts(cx,cy,SZ)}" fill="var(--${t})"/>${art(t,cx,cy,SZ,q,r)}</g><polygon class="mark" points="${hexPts(cx,cy,SZ-4)}" style="stroke:${pc(G.turn)}"/>`;}
  if(hover&&G.tiles[hover])o+=perimeter(G.tiles,patchOf(G.tiles,hover).keys);
  else if(G.phase==='flag')o+=perimeter(G.tiles,patchOf(G.tiles,G.last).keys,pc(G.turn));
  if(G.last&&G.tiles[G.last]&&G.phase!=='flag'){const tl=G.tiles[G.last];const [cx,cy]=center(tl.q,tl.r);
    o+=`<polygon class="mark" points="${hexPts(cx,cy,SZ-6)}" style="stroke:${pc(1-G.turn)}"/>`;}
  o+=L.flags;
  svg.innerHTML=o;
}

function patchText(p){
  const nm=G.names;
  let who='Nobody yet';
  if(p.pts[0]&&p.pts[1])who=`Split, ${fmt(p.pts[0])} each`;
  else if(p.pts[0]||p.pts[1]){const w=p.pts[0]?0:1;who=`<span style="color:${pc(w)}">${esc(nm[w])}</span>, ${p.size}`;}
  const fl=[0,1].filter(i=>p.f[i]).map(i=>`${esc(nm[i])} ${p.f[i]}`).join(' · ');
  return `<div class="row"><strong>${TYPES[p.t]} patch</strong><span>${plural(p.size,'tile')}</span></div>${fl?`<div class="row"><span>Flags</span><span>${fl}</span></div>`:''}<div class="row"><span>Points to</span><span>${who}</span></div>`;
}
const deltas=d=>`${esc(G.names[G.turn])} ${fd(d[G.turn])} · ${esc(G.names[1-G.turn])} ${fd(d[1-G.turn])}`;

function renderSide(){
  const me=G.turn,nm=G.names,over=G.phase==='over',tot=totals(patches(G.tiles));
  document.documentElement.style.setProperty('--pc',pc(me));
  $('turncount').textContent=over?'Final score':`Turn ${Math.min(G.placed+(G.phase==='flag'?0:1),G.total)} of ${G.total}`;
  $('scores').innerHTML=[0,1].map(p=>`<div class="pl${p===me&&!over?' active':''}" style="--pc:${pc(p)}"><div class="nm"><span>${esc(nm[p])}</span>${p===me&&!over?'<span class="tp">to play</span>':''}</div><div class="sc">${fmt(tot[p])}</div><div class="fl" title="${G.flags[p]} of 6 flags left">${Array.from({length:6},(_,i)=>flagIcon(p,i>=G.flags[p])).join('')}</div></div>`).join('');

  const who=`<b>${esc(nm[me])}</b>`;
  let st='';
  if(G.phase==='pick')st=`${who}, choose a tile.`;
  else if(G.phase==='place')st=`${who}, place the ${TYPES[G.market[G.sel]].toLowerCase()}.`;
  else if(G.phase==='flag')st=`${who}, plant a flag on this patch?`;
  else if(tot[0]===tot[1])st=`A dead heat at ${fmt(tot[0])} each.`;
  else{const w=tot[0]>tot[1]?0:1;st=`<b style="--pc:${pc(w)}">${esc(nm[w])}</b> wins, ${fmt(tot[w])} to ${fmt(tot[1-w])}.`;}
  $('status').innerHTML=st;

  $('market').innerHTML=G.market.length?G.market.map((t,i)=>`<button type="button" class="mk${G.sel===i?' sel':''}" data-i="${i}" ${G.phase==='flag'||over?'disabled':''} aria-pressed="${G.sel===i}">${miniHex(t)}<span>${TYPES[t]}</span></button>`).join(''):'<div class="empty">The market is empty.</div>';

  let pv='',act='';
  if(G.phase==='place'){
    const k=pending||hover,cand=candidates();
    if(k&&cand[k]){const {q,r}=cand[k],t=G.market[G.sel];
      if(!legal(k,q,r,t))pv=`<div class="hint">Friendly rules: this would merge a claimed patch with another.</div>`;
      else{pv=`<div class="row"><span>Placed here</span><span>${deltas(simulate(k,q,r,t,false))}</span></div>`;
        if(G.flags[me]>0)pv+=`<div class="row"><span>With a flag</span><span>${deltas(simulate(k,q,r,t,true))}</span></div>`;
        if(pending)act=`<button type="button" class="btn primary" data-act="place">Place here</button>`;}
    }else if(hover&&G.tiles[hover])pv=patchText(patchOf(G.tiles,hover));
    else pv=`<div class="hint">${touch?'Tap':'Point at'} an open space to see what it scores.</div>`;
  }else if(G.phase==='flag'){
    const p=patchOf(G.tiles,G.last);
    const tiles=Object.assign({},G.tiles);tiles[G.last]=Object.assign({},tiles[G.last],{flag:me});
    const a=totals(patches(tiles)),b=totals(patches(G.tiles));
    pv=`<div class="row"><strong>${TYPES[p.t]} patch</strong><span>${plural(p.size,'tile')}</span></div><div class="row"><span>With your flag</span><span>${deltas([a[0]-b[0],a[1]-b[1]])}</span></div>`;
    act=`<button type="button" class="btn primary" data-act="plant">Plant flag</button><button type="button" class="btn" data-act="skip">Don't plant</button>`;
  }else if(G.phase==='pick'){
    if(hover&&G.tiles[hover])pv=patchText(patchOf(G.tiles,hover));
  }else{
    act=`<button type="button" class="btn primary" data-act="again" style="--pc:var(--ink)">Play again</button>`;
  }
  $('preview').innerHTML=pv;$('actions').innerHTML=act;

  $('undo').disabled=!hist.length;
}

function renderEnd(){
  if(G.phase!=='over'){$('endov').hidden=true;return;}
  const list=patches(G.tiles),tot=totals(list),nm=G.names,tie=tot[0]===tot[1],w=tot[0]>tot[1]?0:1;
  const top=list.filter(p=>p.pts[0]+p.pts[1]>0).sort((a,b)=>b.size-a.size).slice(0,5);
  $('endcard').innerHTML=`<h2>${tie?'A dead heat':esc(nm[w])+' wins'}</h2>
  <div class="players">${[0,1].map(p=>`<div class="pl${!tie&&p===w?' active':''}" style="--pc:${pc(p)}"><div class="nm"><span>${esc(nm[p])}</span></div><div class="sc">${fmt(tot[p])}</div><div class="fl">${G.flags[p]?plural(G.flags[p],'flag')+' unplanted':'All flags planted'}</div></div>`).join('')}</div>
  <div><h3 class="sec">Biggest claims</h3><div class="plist">${top.length?top.map(p=>`<div><span>${TYPES[p.t]}, ${plural(p.size,'tile')}</span><span style="color:${p.pts[0]&&p.pts[1]?'var(--muted)':pc(p.pts[0]?0:1)}">${p.pts[0]&&p.pts[1]?'Split':esc(nm[p.pts[0]?0:1])}</span></div>`).join(''):'<div>No patches were claimed.</div>'}</div></div>
  <div class="btns"><button type="button" class="btn" data-act="look">View board</button><button type="button" class="btn primary" data-act="again">Play again</button></div>`;
  $('endov').hidden=false;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){if(!G)return;renderBoard();renderSide();renderEnd();save();}
function save(){try{localStorage.setItem('hedgerow',JSON.stringify({G,hist:hist.slice(-30)}));}catch(e){}}

/* ---------- how to play ---------- */
function fig(list,opt={}){
  const tiles={};list.forEach(([q,r,t,flag])=>{tiles[K(q,r)]={q,r,t,flag:flag===undefined?null:flag};});
  const L=drawLand(tiles,false),pts=list.map(([q,r])=>center(q,r));
  let o=L.land;
  if(opt.ghost){const [q,r,t]=opt.ghost,[cx,cy]=center(q,r);pts.push([cx,cy]);
    o+=`<g class="ghost"><polygon points="${hexPts(cx,cy,SZ)}" fill="var(--${t})"/>${art(t,cx,cy,SZ,q,r)}</g><polygon class="mark" points="${hexPts(cx,cy,SZ-4)}" style="stroke:var(--p0)"/>`;}
  if(opt.outline)o+=perimeter(tiles,opt.outline.map(([q,r])=>K(q,r)),opt.color);
  if(opt.spots)opt.spots.forEach(([q,r])=>{const [cx,cy]=center(q,r);pts.push([cx,cy]);o=`<polygon points="${hexPts(cx,cy,SZ-3)}" class="spot ok" style="--pc:var(--p0)"/>`+o;});
  o+=L.flags;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=SZ*1.35;
  const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad;
  return `<svg viewBox="${f1(x0)} ${f1(y0)} ${f1(Math.max(...xs)-x0+pad)} ${f1(Math.max(...ys)-y0+pad)}" aria-hidden="true">${o}</svg>`;
}
const FOREST=[[0,0],[1,0],[0,1]];
const PATCHES=[[0,0,'forest'],[1,0,'forest'],[0,1,'forest'],[1,-1,'field'],[2,-1,'field'],[-1,1,'lake'],[1,1,'mountain']];
const RULES=[
  {h:'Lay a tile',p:'On your turn, take one of the three tiles from the market and place it so it touches the board. You each get 15 turns.',
   fig:()=>fig([[0,0,'field'],[1,0,'lake'],[0,1,'forest'],[1,-1,'field']],{ghost:[-1,1,'forest'],spots:[[-1,0],[0,-1],[2,-1],[2,0],[1,1]]})},
  {h:'Matching land forms a patch',p:'Touching tiles of the same land join into one patch, however far it spreads. Point at any tile during a game to outline its patch.',
   fig:()=>fig(PATCHES,{outline:FOREST})},
  {h:'Plant a flag to claim it',p:'After placing a tile you can plant a flag on it, claiming its whole patch. You have six flags, so save them for patches worth holding.',
   fig:()=>fig(PATCHES.map(([q,r,t])=>[q,r,t,q===0&&r===1?0:null]),{outline:FOREST,color:'var(--p0)'})},
  {h:'Most flags takes the patch',p:'At the end, each patch scores a point per tile for whoever has the most flags in it. Ties split the points. Patches can merge, so no lead is ever quite safe.',
   fig:()=>fig([[0,0,'field',0],[1,0,'field'],[2,0,'field',0],[0,1,'field'],[1,1,'field',1],[-1,1,'lake'],[2,1,'mountain'],[1,-1,'forest']],{outline:[[0,0],[1,0],[2,0],[0,1],[1,1]],color:'var(--p0)'})},
];
let rstep=0,rulesThen=null,rulesDone='Done';
function openRules(then,done){rstep=0;rulesThen=then||null;rulesDone=done||'Done';renderRules();$('rulesov').hidden=false;$('rnext').focus();}
function renderRules(){
  const s=RULES[rstep];
  $('rfig').innerHTML=s.fig();$('rtitle').textContent=s.h;$('rtext').textContent=s.p;
  $('rstep').textContent=`${rstep+1} of ${RULES.length}`;
  $('rprev').style.visibility=rstep?'visible':'hidden';
  $('rnext').textContent=rstep===RULES.length-1?rulesDone:'Next';
}
function closeRules(){
  $('rulesov').hidden=true;
  try{localStorage.setItem('hedgerow-rules','1');}catch(e){}
  const then=rulesThen;rulesThen=null;if(then)then();
}
function openSetup(cancelable){
  $('p0name').value=G.names[0];$('p1name').value=G.names[1];$('friendly').checked=G.friendly;
  $('setupcancel').hidden=!cancelable;$('setup').hidden=false;$('p0name').focus();
}

/* ---------- events ---------- */
svg.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const g=e.target.closest('[data-spot],[data-tile]');const k=g?(g.dataset.spot||g.dataset.tile):null;
  if(k!==hover){hover=k;renderBoard();renderSide();}
});
svg.addEventListener('pointerleave',()=>{if(hover){hover=null;renderBoard();renderSide();}});
svg.addEventListener('click',e=>{
  const g=e.target.closest('[data-spot],[data-tile]');if(!g)return;
  if(g.dataset.tile){if(G.phase==='flag'&&g.dataset.tile===G.last){plant();return;}
    if(e.pointerType!=='mouse'){hover=hover===g.dataset.tile?null:g.dataset.tile;renderBoard();renderSide();}return;}
  if(G.phase!=='place'||g.dataset.bad)return;
  const k=g.dataset.spot;
  if(e.pointerType==='mouse'||pending===k)place(k);else{pending=k;renderBoard();renderSide();}
});
$('market').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b&&!b.disabled)pick(+b.dataset.i);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='plant')plant();else if(a==='skip')skip();else if(a==='place'&&pending)place(pending);
  else if(a==='look')$('endov').hidden=true;
  else if(a==='again'){G=newGame(G.names,G.friendly);hist=[];render();}
  else if(a==='rprev'&&rstep>0){rstep--;renderRules();}
  else if(a==='rnext'){if(rstep<RULES.length-1){rstep++;renderRules();}else closeRules();}
});
document.addEventListener('keydown',e=>{
  if($('rulesov').hidden){if(e.key==='Escape'&&!$('setup').hidden&&!$('setupcancel').hidden)$('setup').hidden=true;return;}
  if(e.key==='Escape')closeRules();
  else if(e.key==='ArrowRight'&&rstep<RULES.length-1){rstep++;renderRules();}
  else if(e.key==='ArrowLeft'&&rstep>0){rstep--;renderRules();}
});
addEventListener('resize',()=>{if(G)renderBoard();});
$('undo').addEventListener('click',undo);
$('rulesbtn').addEventListener('click',()=>openRules());
$('newbtn').addEventListener('click',()=>openSetup(true));
$('setupcancel').addEventListener('click',()=>{$('setup').hidden=true;});
$('setuprules').addEventListener('click',()=>{const c=!$('setupcancel').hidden;$('setup').hidden=true;openRules(()=>openSetup(c),'Back to setup');});
$('setupform').addEventListener('submit',e=>{e.preventDefault();
  const n=[$('p0name').value.trim()||'Player 1',$('p1name').value.trim()||'Player 2'];
  G=newGame(n,$('friendly').checked);hist=[];hover=null;pending=null;$('setup').hidden=true;$('endov').hidden=true;render();});

function start(data){
  if(data&&data.G){G=data.G;hist=data.hist||[];render();return;}
  try{const s=JSON.parse(localStorage.getItem('hedgerow')||'null');if(s&&s.G&&s.G.phase!=='over'&&s.G.placed>0){G=s.G;hist=s.hist||[];render();return;}}catch(e){}
  G=newGame(['Player 1','Player 2'],false);render();
  let seen=false;try{seen=!!localStorage.getItem('hedgerow-rules');}catch(e){}
  if(seen)openSetup(false);else openRules(()=>openSetup(false),'Set up a game');
}
window.claude?.hot?.snapshot?.(()=>({G,hist}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
</body></html>
